# Basic
title: 安杰の博客
subtitle: 个人站
description: 欢迎来到我的个人博客
# 头像里面的标题
avatarTitle: 安杰の博客
# 头像里面的描述
avatarDesc: Test / UID

# ============================================================
# ★ 换域名只改两处：这里的 url + 仓库根目录的 CNAME 文件
#   站内链接、RSS、og:url、canonical、JSON-LD、sitemap 都由 Liquid 从 url 派生，无需逐处改；
#   文章正文里的图片是「根相对路径」（/assets/img/rin/xxx.webp），与域名完全无关，换域名自动生效。
#   若将来改成子路径部署（如 example.com/blog/），把 baseurl 填上即可。
# ============================================================
url: "https://10000101.xyz"
# baseurl: "/blog"

# 主站（Rin）域名：全站唯一来源。同步脚本、评论接口都从这里读，换主站域名只改这一行
rin:
    main_url: "https://aunger.eu.org"
    # 评论接口单独走哪个域名（可选，默认跟随 main_url）。
    # 用途：主站域名开了 Cloudflare 防爬（Bot Fight Mode）会连跨站评论请求一起挑战，
    # 若某天主站两个域名都被防爬挡住评论，可在这里指到一个不挑跨域请求的域名。
    # comment_url: "https://blog.l1n2.com"

# 博客是否自动生成目录，false为不生成
enableToc: true

# Comment
# 备份站评论：直连主站 Rin 公开 comment API（issue #3 / D 方案）
# - 零密钥：浏览器请求只带公开 URL + 评论字段
# - 数据进主站 D1 comments 表，主站文章页同步显示
# - 游客匿名（仅昵称必填），不暴露 GitHub 用户名
# - 前端限流：60 秒 1 条、内容 ≤ 1000 字
# ★ API 前缀不在这里配置，由上面的 rin.main_url 自动派生（见 _includes/comments.html），
#   换主站域名只改 rin.main_url 一处。

# Social
social:
    github: aunger01
    # zhihu: aunger01
    # juejin: aunger
    jianshu: d36aca9e76eb
    # twitter: 
    mail: vip@L1N2.com


# 百度统计 
# 使用博客模板请去掉或者更换 id 
baidu:
   id: fde0ae1ed9908cb0c10f5a6e565315cd  

# Google Analytics
# 使用博客模板请去掉或者更换 id
# ga:
#   id: 输入Google analytics ID 
#   host: auto  


# 《----------------- 上面的信息修改成你自己的 ---------------------------》
#
#
#  _post/ 下的文章更换成你自己的文章
#  帮忙star一下，感谢~😆 地址： https://aunger.eu.org
#
#
# 《--------------- 下面的信息可以自行选择是否修改 ------------------------》


permalink: /:year/:month/:title/
# Format
highlighter: rouge

# 博客首页已迁移到 /blog/（根路径 index.html 为独立静态掩饰页）
# 注意：jekyll-paginate 只能分页根目录 index.html，无法用于 /blog/ 子目录，
# 故移除该插件；/blog/ 首页改用前端分页（每页 5 篇，见 blog/index.html）。
# 旧地址 /page2/、/page3/ 不再生成。

textColor: #FF0000

# supported colors: blue, green, purple, red, orange or slate. If you need clear, leave it empty.
cover_color: clear

# The blog button should not be removed.
blog_button:
    title: 博客主页

# Navigation buttons in the front page.s
nav:
    - {title: 所有文章, description: archive, url: '/archive'}   
    - {title: 标签, description: tags, url: '/tags'}      
    - {title: 动态, description: moments, url: '/moments'}
    - {title: 关于我, description: about, url: '/about'}


plugins: [jekyll-sitemap]


