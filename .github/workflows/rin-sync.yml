name: Rin Sync

# 每周一 12:00 (北京时间) 从 Rin 主站 D1 同步文章到本备份站
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync posts from D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/rin-sync.mjs

      - name: Export full D1 backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p d1-backup
          npx --yes wrangler@latest d1 export rin --remote --output "d1-backup/rin-$(date -u +%Y-%m-%d).sql"

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup/
          retention-days: 90

      - name: Commit and push if changed
        env:
          SYNC_GH_TOKEN: ${{ secrets.SYNC_GH_TOKEN }}
        run: |
          git config user.name "Aunger (Rin Sync)"
          git config user.email "aunger01@users.noreply.github.com"
          git add _posts/
          if git diff --cached --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: 从 Rin 主站同步文章 $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${SYNC_GH_TOKEN}@github.com/aunger01/aunger01.github.io.git" HEAD:master
          fi
