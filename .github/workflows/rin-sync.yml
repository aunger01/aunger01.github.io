name: Rin Sync

# 每周一 12:00 (北京时间) 从 Rin 主站 D1 同步文章到本备份站--因拥堵导致自动化失效故又在下方进行调整
on:
  # 每周一 14:17 (北京时间) 从 Rin 主站 D1 同步文章到本备份站（避开整点拥堵）
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync posts from D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # 主站域名：仓库 Settings → Variables 里配 RIN_MAIN_SITE 即可换域名，不改代码；
          # 未配置时脚本自动回落到 _config.yml 的 rin.main_url
          RIN_MAIN_SITE: ${{ vars.RIN_MAIN_SITE }}
          # 统一压 webp：sharp 缺失时直接报错，避免静默退化成原格式
          RIN_REQUIRE_WEBP: '1'
        run: |
          npm install --no-save sharp
          node scripts/rin-sync.mjs

      # 白名单导出：仅内容表，排除 cache（站内配置含 webhook/api_key 明文）与 users（password/openid）
      # _cf_KV 为 CF 保护表，wrangler 导出时本就跳过
      - name: Export D1 backup (content tables only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          mkdir -p d1-backup
          npx --yes wrangler@latest d1 export rin --remote --output "d1-backup/rin-$(date -u +%Y-%m-%d).sql" \
            --table feeds --table feed_hashtags --table hashtags \
            --table comments --table moments --table friends \
            --table info --table visit_stats --table visits

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: d1-backup/
          retention-days: 90

      - name: Commit and push if changed
        env:
          SYNC_GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REMOTE="https://x-access-token:${SYNC_GH_TOKEN}@github.com/aunger01/aunger01.github.io.git"
          git config user.name "Aunger (Rin Sync)"
          git config user.email "aunger01@users.noreply.github.com"
          git add _posts/ _data/ assets/img/rin/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "sync: 从 Rin 主站同步文章 $(date -u +%Y-%m-%d)"

          # GitHub 偶发 5xx 会让一次推送白干（2026-11-04 Git Operations 故障即如此，
          # 已抓好的图随 runner 一起销毁）。退避重试 6 次，总窗口约 5 分钟。
          for i in 1 2 3 4 5 6; do
            if git push "$REMOTE" HEAD:master; then
              echo "push 成功（第 $i 次尝试）"
              exit 0
            fi
            echo "::warning::push 第 $i 次失败，稍后重试"
            sleep $((i * 15))
            # 远端可能已被别处推进，先对齐再推，避免 non-fast-forward
            if git fetch "$REMOTE" master --quiet 2>/dev/null; then
              git rebase FETCH_HEAD --quiet || { git rebase --abort || true; }
            fi
          done
          echo "::error::push 连续 6 次失败，疑似 GitHub 平台故障，请稍后手动重跑本工作流（同步是幂等的，可反复重跑）"
          exit 1
