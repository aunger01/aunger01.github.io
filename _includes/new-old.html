<section>
  <div class="like-box">
    <button class="like-btn" id="post-like-btn" type="button" aria-label="点赞">
      <span class="like-heart" id="post-like-heart">&#9829;</span>
      <span class="like-sep"></span>
      <span class="like-count" id="post-like-count">0</span>
    </button>
    <p class="like-tip">觉得写得不错，就点个赞吧</p>
  </div>
  <script type="text/javascript">
  (function () {
    var btn = document.getElementById('post-like-btn');
    var cnt = document.getElementById('post-like-count');
    var heart = document.getElementById('post-like-heart');
    if (!btn || !cnt || !heart) return;

    var key = 'blog-like:' + location.pathname;

    // 每篇文章一个稳定的"基础热度"（纯前端假数据，由路径哈希生成 12~99 的定值）
    function baseCount(path) {
      var h = 0;
      for (var i = 0; i < path.length; i++) { h = (h * 131 + path.charCodeAt(i)) >>> 0; }
      return 12 + (h % 88);
    }

    var liked = 0;
    try { liked = parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (e) {}

    function render() {
      cnt.textContent = baseCount(location.pathname) + liked;
    }
    render();

    var popTimer = null;
    btn.addEventListener('click', function () {
      liked += 1;
      try { localStorage.setItem(key, String(liked)); } catch (e) {}
      render();

      // 小动画：爱心弹一下 + 飘一颗心
      heart.classList.remove('pop');
      void heart.offsetWidth;
      heart.classList.add('pop');

      var f = document.createElement('span');
      f.className = 'like-float';
      f.innerHTML = '&#9829;';
      btn.parentNode.appendChild(f);
      setTimeout(function () { f.remove(); }, 900);
    });
  })();
  </script>

  <ul class="pager">
    {% if page.previous.url %}
    <li class="previous">
        <a href="{{ page.previous.url | prepend: site.baseurl | replace: '//', '/' }}" data-toggle="tooltip" data-placement="top" title="{{page.previous.title}}">上一篇：  <span>{{page.previous.title}}</span>
        </a>
    </li>
    {% endif %}
    {% if page.next.url %}
    <li class="next">
        <a href="{{ page.next.url | prepend: site.baseurl | replace: '//', '/' }}" data-toggle="tooltip" data-placement="top" title="{{page.next.title}}">下一篇：  <span>{{page.next.title}}</span>
        </a>
    </li>
    {% endif %}
  </ul>
</section>
