<footer class="site-footer">
  <div class="footer-social">
    {% if site.social.github %}
    <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener noreferrer" title="GitHub"><i class="fa fa-github"></i></a>
    {% endif %}
    {% if site.social.weibo %}
    <a href="http://weibo.com/{{ site.social.weibo }}" target="_blank" rel="noopener noreferrer" title="微博"><i class="fa fa-weibo"></i></a>
    {% endif %}
    {% if site.social.jianshu %}
    <a href="https://www.jianshu.com/u/{{ site.social.jianshu }}" target="_blank" rel="noopener noreferrer" title="简书"><i class="fa fa-book"></i></a>
    {% endif %}
    {% if site.social.mail %}
    <a href="mailto:{{ site.social.mail }}" title="邮箱"><i class="fa fa-envelope"></i></a>
    {% endif %}
    <a href="/feed.xml" target="_blank" rel="noopener noreferrer" title="RSS"><i class="fa fa-rss"></i></a>
  </div>

  <p class="footer-copy">
    &copy; {{ site.time | date: '%Y' }} {{ site.title }} · Powered by <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> · Theme <a href="http://leopardpan.cn/" target="_blank" rel="noopener noreferrer">leopardpan</a> · 重构 by 安杰
  </p>
  <p class="footer-pv" id="busuanzi_container_site_pv">
    本站总访问量 <span id="busuanzi_value_site_pv"></span> 次
  </p>
</footer>
